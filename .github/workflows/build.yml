name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar carpeta www con la app
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Agregar permisos de notificaciones
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK como archivo de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: paso-a-paso-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases (para descargar fácil desde el celular)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk paso-a-paso.apk
          gh release delete apk-actual --cleanup-tag -y --repo "${{ github.repository }}" || true
          gh release create apk-actual paso-a-paso.apk --repo "${{ github.repository }}" --title "Paso a Paso (APK)" --notes "Última versión compilada. Descarga paso-a-paso.apk e instálalo."
